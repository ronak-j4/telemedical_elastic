# ==============================================================
# Hospital Management Dashboard - Backend (DA2 + Elasticsearch)
# Oracle connection is fully driven by environment variables.
# ==============================================================

spring.application.name=hospital-dashboard-backend
server.port=8080

# --- Oracle DataSource (values injected via environment variables) ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/xepdb1}
spring.datasource.username=${DB_USERNAME:hospital}
spring.datasource.password=${DB_PASSWORD:hospital}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP basic pool sizing - don't fail boot if Oracle is offline
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# --- Elasticsearch Configuration ---
elasticsearch.uri=${ELASTICSEARCH_URI:http://localhost:9200}
elasticsearch.connect-timeout-ms=2500
elasticsearch.read-timeout-ms=4000
elasticsearch.auto-sync-on-boot=true

# --- CORS: allow the local frontend dev origin (configurable) ---
app.cors.allowed-origin=${FRONTEND_ORIGIN:*}

# --- Jackson: don't fail on empty beans, keep dates readable ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.hospital.dashboard=DEBUG
